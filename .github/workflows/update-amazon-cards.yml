name: Update Amazon product cards

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh product data from Creators API
        env:
          AMAZON_CREATOR_APPLICATION_ID: ${{ secrets.AMAZON_CREATOR_APPLICATION_ID }}
          AMAZON_CREATOR_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATOR_CREDENTIAL_ID }}
          AMAZON_CREATOR_SECRET: ${{ secrets.AMAZON_CREATOR_SECRET }}
          AMAZON_CREATOR_VERSION: ${{ secrets.AMAZON_CREATOR_VERSION }}
        run: node scripts/update-amazon-cards.mjs
      - name: Commit refreshed cards
        run: |
          git diff --quiet && exit 0
          git config user.name "gearline-lab[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Refresh Amazon product cards"
          git push
